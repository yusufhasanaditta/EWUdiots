<body>

        <a class="logo" href="#/home" aria-label="EWUdiots home"><span class="word">EWU<i>diots</i><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9 3 4M11 7l1-5M16 10l5-3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span><small>Unofficial · not affiliated with EWU</small></a>

      <div class="content">
        <header class="topbar">
          <a class="logo mlogo" href="#/home" aria-label="EWUdiots home"><span class="word">EWU<i>diots</i><svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9 3 4M11 7l1-5M16 10l5-3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></span><small>Unofficial · not affiliated with EWU</small></a>

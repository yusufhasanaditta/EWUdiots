# Pulls new ewubd.edu news, notices, events and ewucoursetracker.live updates every 30 minutes.
# It calls the same /api/cron job with the CRON_SECRET repo secret; the daily Vercel run still does newsletters and clean-up.
name: Refresh news, notices, tracker and events
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: {}
concurrency: { group: refresh-feeds, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the feed jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 240 -H "Authorization: Bearer $CRON_SECRET" "https://ewudiots.vercel.app/api/cron?job=news,notices,events,courses,tracker"

# Builds the Android app and the Chrome extension, then publishes them as a GitHub Release, which the website's
# /download/android and /download/extension links point at (releases/latest). No Android Studio needed.
# Repo secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SITE_URL (e.g. https://ewudiots.vercel.app)
#   ANDROID_KEYSTORE_BASE64 (base64 of the upload keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Keep the same keystore forever: phones only accept an update signed with the key that signed the first install.
name: Android release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "extension/**", ".github/workflows/android.yml"]
    tags: ["v*"]

permissions:
  contents: write

concurrency: { group: android-release, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.SITE_URL }}
      - run: npx cap sync android
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed APK and bundle
        working-directory: app/android
        run: |
          chmod +x gradlew
          VERSION_CODE=$(( $(date +%s) / 60 ))
          VERSION_NAME=$(node -p "require('../package.json').version")
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.version.code=$VERSION_CODE \
            -Pandroid.injected.version.name=$VERSION_NAME \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/out/EWUdiots.apk"
          cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/out/EWUdiots.aab"
      - name: Package Chrome extension
        working-directory: extension
        env:
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          node -e '
            const fs = require("fs"), site = (process.env.SITE_URL || "").replace(/\/$/, "");
            fs.writeFileSync("config.js", "// Generated by the Android release workflow.\nself.EWUD_CONFIG = " + JSON.stringify({
              supabaseUrl: process.env.SB_URL || "", supabaseKey: process.env.SB_KEY || "", appUrl: site ? site + "/app.html" : "http://localhost:5500/app.html" }, null, 2) + ";\n");'
          zip -r "$RUNNER_TEMP/out/EWUdiots-extension.zip" . -x ".*"
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="app-v$VERSION-${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP"/out/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "EWUdiots $VERSION (build ${{ github.run_number }})" \
            --notes "Android app (EWUdiots.apk: install directly; EWUdiots.aab: for Google Play) and the Chrome extension (EWUdiots-extension.zip: unzip, then chrome://extensions → Developer mode → Load unpacked). Unofficial · not affiliated with EWU."
